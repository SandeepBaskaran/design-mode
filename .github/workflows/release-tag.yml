name: Release tag

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: design-mode-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag main when the version is newer
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - name: Refuse any ref other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Release tag only runs from main. This run is ${{ github.ref }}." >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compare package.json with the latest release tag
        id: decide
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { compareSemver, parseSemver } from './scripts/release-preflight.mjs';

          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const parsed = parseSemver(version);
          if (!parsed) {
            console.error(`Root package.json version is not MAJOR.MINOR.PATCH: ${version}`);
            process.exit(1);
          }
          execFileSync('git', ['fetch', 'origin', '--tags', '--force'], { stdio: 'inherit' });
          const tags = execFileSync('git', ['tag', '-l', 'v*'], { encoding: 'utf8' })
            .split('\n').map((line) => line.trim()).filter(Boolean);
          const releases = tags.map((tag) => parseSemver(tag)).filter(Boolean)
            .sort(compareSemver);
          const latest = releases.length ? releases[releases.length - 1].version : null;
          const tag = `v${parsed.version}`;
          const exists = tags.includes(tag);
          let release = false;
          let summary;
          if (exists) {
            summary = `${tag} already exists. Nothing was tagged or published.`;
          } else if (latest && compareSemver(parsed, parseSemver(latest)) <= 0) {
            summary = `package.json is ${parsed.version}, which is not newer than the latest release ${latest}. Nothing was tagged or published.`;
          } else {
            release = true;
            summary = `${tag} is newer than ${latest ?? 'every existing tag'}. Preflight will run, then the tag is pushed and the release jobs start in this run.`;
          }
          console.log(summary);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `release=${release}\ntag=${tag}\n`);
          EOF

      - name: Set the release identity and run preflight
        if: steps.decide.outputs.release == 'true'
        run: |
          git config user.name "Sandeep Baskaran"
          git config user.email "29013187+SandeepBaskaran@users.noreply.github.com"
          npm run release:preflight

      - name: Create and push the annotated tag
        if: steps.decide.outputs.release == 'true'
        run: |
          tag="${{ steps.decide.outputs.tag }}"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
          echo "Pushed $tag. A token push does not start Release on its own, so this run calls it next."

  publish:
    name: Release
    needs: tag
    if: needs.tag.outputs.release == 'true'
    permissions:
      contents: write
      actions: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
