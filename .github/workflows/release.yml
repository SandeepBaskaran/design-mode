name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Package Chrome, Firefox and Safari releases
        env:
          DM_POSTHOG_HOST: ${{ secrets.DM_POSTHOG_HOST }}
          DM_POSTHOG_KEY: ${{ secrets.DM_POSTHOG_KEY }}
          DM_DISTRIBUTION: published_hint
        run: npm run package:extension:release
      - name: Extract CHANGELOG section for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            BEGIN { in_section = 0 }
            /^## \[/ {
              if (in_section) exit
              if ($0 ~ "\\[" v "\\]") { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            packages/extension/design-mode-extension.zip
            packages/extension/design-mode-addon.zip
            packages/extension/designmode-for-safari.zip
          body_path: release-notes.md
