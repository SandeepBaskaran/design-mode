name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Gate: the tagged commit must pass the same checks CI runs on main,
      # and the tag must name the version the tree actually carries. A tag
      # pushed on a red or mis-versioned commit fails here and publishes
      # nothing, instead of shipping artifacts CI never approved.
      - name: Verify tagged commit
        run: npm run verify
      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          MANIFEST="$(node -p "require('./packages/extension/public/manifest.json').version")"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$MANIFEST" ]; then
            echo "Tag v$TAG does not match package.json ($PKG) / manifest.json ($MANIFEST)" >&2
            exit 1
          fi
      - name: Package Chrome, Firefox and Safari releases
        env:
          DM_POSTHOG_HOST: ${{ secrets.DM_POSTHOG_HOST }}
          DM_POSTHOG_KEY: ${{ secrets.DM_POSTHOG_KEY }}
          DM_DISTRIBUTION: published_hint
        run: npm run package:extension:release
      - name: Extract CHANGELOG section for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            BEGIN { in_section = 0 }
            /^## \[/ {
              if (in_section) exit
              if ($0 ~ "\\[" v "\\]") { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            packages/extension/design-mode-extension.zip
            packages/extension/design-mode-addon.zip
            packages/extension/designmode-for-safari.zip
          body_path: release-notes.md
