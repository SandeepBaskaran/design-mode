name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write

# One group, and no called workflow, so a run cannot deadlock itself.
# A second push waits, then stops when the tag or the GitHub Release
# already exists. The tag this run pushes uses the workflow token,
# which does not start another run.
concurrency:
  group: design-mode-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Decide whether this ref is a new release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      createTag: ${{ steps.decide.outputs.createTag }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - name: Refuse a manual run from any ref other than main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Release only runs from main. This run is ${{ github.ref }}." >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compare package.json with the latest release tag
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { decideRelease } from './scripts/release-decision.mjs';
          import { parseSemver } from './scripts/release-preflight.mjs';

          const eventName = process.env.EVENT_NAME;
          const refType = process.env.REF_TYPE;
          const refName = process.env.REF_NAME;
          const before = process.env.BEFORE || '';
          let version = '';
          let previousVersion = null;
          if (refType !== 'tag') {
            version = JSON.parse(readFileSync('package.json', 'utf8')).version;
            if (eventName === 'push' && before && !/^0+$/.test(before)) {
              try {
                previousVersion = JSON.parse(
                  execFileSync('git', ['show', `${before}:package.json`], { encoding: 'utf8' }),
                ).version;
              } catch (error) {
                console.error(`Could not read package.json at ${before}: ${error.message}`);
                process.exit(1);
              }
            }
          }
          execFileSync('git', ['fetch', 'origin', '--tags'], { stdio: 'inherit' });
          const tags = execFileSync('git', ['tag', '-l', 'v*'], { encoding: 'utf8' }).split('\n');
          let githubReleaseExists = null;
          const parsedVersion = refType === 'tag' ? null : parseSemver(version);
          if (parsedVersion && tags.some((name) => name.trim() === `v${parsedVersion.version}`)) {
            const tagName = `v${parsedVersion.version}`;
            try {
              execFileSync('gh', ['release', 'view', tagName, '--repo', process.env.GITHUB_REPOSITORY], { stdio: 'pipe' });
              githubReleaseExists = true;
            } catch (error) {
              const text = `${error.stdout || ''}${error.stderr || ''}`;
              if (/not found/i.test(text)) githubReleaseExists = false;
              else {
                console.error(text || error.message);
                process.exit(1);
              }
            }
          }
          const decision = decideRelease({
            eventName, refType, refName, version, previousVersion, tags, githubReleaseExists,
          });
          console.log(decision.summary);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${decision.summary}\n`);
          if (decision.error) process.exit(1);
          appendFileSync(process.env.GITHUB_OUTPUT, `release=${decision.release}\ncreateTag=${decision.createTag}\ntag=${decision.tag}\n`);
          EOF

      - name: Set the release identity and run preflight
        if: steps.decide.outputs.createTag == 'true'
        run: |
          git config user.name "Sandeep Baskaran"
          git config user.email "29013187+SandeepBaskaran@users.noreply.github.com"
          npm run release:preflight

      - name: Create and push the annotated tag
        if: steps.decide.outputs.createTag == 'true'
        run: |
          tag="${{ steps.decide.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "$tag already exists. This run does not move, delete, or force-push tags." >&2
            exit 1
          fi
          git tag -a "$tag" -m "$tag"
          git push origin "refs/tags/${tag}"
          echo "Created $tag with the workflow token. That push does not start another Release run."

  release:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      tag: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Skip when this tag already has a GitHub Release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set +e
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>"$RUNNER_TEMP/release-view.txt"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$RELEASE_TAG already has a GitHub Release. This run will not package or publish again." >> "$GITHUB_STEP_SUMMARY"
          elif grep -qi 'not found' "$RUNNER_TEMP/release-view.txt"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/release-view.txt" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.publish == 'true'
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.publish == 'true'
        with:
          node-version: '20'
          cache: 'npm'
      - if: steps.gate.outputs.publish == 'true'
        run: npm ci
      # The tagged commit must pass the same checks CI runs on main,
      # and the tag must name the version the tree actually carries.
      - name: Verify tagged commit
        if: steps.gate.outputs.publish == 'true'
        run: npm run verify
      - name: Check tag matches package version
        if: steps.gate.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          TAG="${RELEASE_TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          MANIFEST="$(node -p "require('./packages/extension/public/manifest.json').version")"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$MANIFEST" ]; then
            echo "Tag v$TAG does not match package.json ($PKG) / manifest.json ($MANIFEST)" >&2
            exit 1
          fi
      - name: Package Chrome, Firefox and Safari releases
        if: steps.gate.outputs.publish == 'true'
        env:
          DM_POSTHOG_HOST: ${{ secrets.DM_POSTHOG_HOST }}
          DM_POSTHOG_KEY: ${{ secrets.DM_POSTHOG_KEY }}
          DM_DISTRIBUTION: published_hint
        run: npm run package:extension:release
      - name: Upload store packages
        if: steps.gate.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: store-packages
          if-no-files-found: error
          retention-days: 7
          path: |
            packages/extension/design-mode-extension.zip
            packages/extension/design-mode-addon.zip
      - name: Extract CHANGELOG section for this tag
        if: steps.gate.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk -v v="$VERSION" '
            BEGIN { in_section = 0 }
            /^## \[/ {
              if (in_section) exit
              if ($0 ~ "\\[" v "\\]") { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no notes for $VERSION" >&2
            exit 1
          fi
      - name: Resolve the tagged commit
        id: target
        if: steps.gate.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          sha=$(git rev-parse "${RELEASE_TAG}^{commit}")
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Could not resolve $RELEASE_TAG to a commit: $sha" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Create release
        if: steps.gate.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          # An annotated tag name is rejected as target_commitish. The SHA
          # is the commit the tag already points at, so the tag is not moved.
          target_commitish: ${{ steps.target.outputs.sha }}
          fail_on_unmatched_files: true
          files: |
            packages/extension/design-mode-extension.zip
            packages/extension/design-mode-addon.zip
            packages/extension/designmode-for-safari.zip
          body_path: release-notes.md

  # Store and npm publishes are independent of each other. A failure in one
  # does not cancel the others. Each job that needs a secret logs a skip and
  # exits 0 until that secret exists. The GitHub environment is where a
  # required reviewer can be added later without changing this file.
  publish-chrome:
    name: Chrome Web Store
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Require Chrome Web Store secrets
        id: secrets
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          missing=()
          [ -n "$CWS_CLIENT_ID" ] || missing+=(CWS_CLIENT_ID)
          [ -n "$CWS_CLIENT_SECRET" ] || missing+=(CWS_CLIENT_SECRET)
          [ -n "$CWS_REFRESH_TOKEN" ] || missing+=(CWS_REFRESH_TOKEN)
          [ -n "$CWS_PUBLISHER_ID" ] || missing+=(CWS_PUBLISHER_ID)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Chrome Web Store publish skipped: these secrets are not set on the release environment or the repository: ${missing[*]}."
            echo "The GitHub Release is already published. Add the secrets, then re-run this job. Setup steps are in RELEASING.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "Chrome Web Store credentials are configured."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: store-packages
          path: store
      - name: Upload and submit to the Chrome Web Store
        if: steps.secrets.outputs.ready == 'true'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: node scripts/publish-chrome-web-store.mjs store/design-mode-extension.zip

  publish-firefox:
    name: Firefox Add-ons
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Require AMO secrets
        id: secrets
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          missing=()
          [ -n "$AMO_JWT_ISSUER" ] || missing+=(AMO_JWT_ISSUER)
          [ -n "$AMO_JWT_SECRET" ] || missing+=(AMO_JWT_SECRET)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Firefox AMO publish skipped: these secrets are not set on the release environment or the repository: ${missing[*]}."
            echo "The GitHub Release is already published. Add the secrets, then re-run this job. Setup steps are in RELEASING.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "AMO JWT credentials are configured."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - uses: actions/download-artifact@v8
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: store-packages
          path: store
      - name: Build the reviewer source archive
        if: steps.secrets.outputs.ready == 'true'
        env:
          DM_FIREFOX_SOURCE_ZIP: ${{ github.workspace }}/design-mode-firefox-source.zip
        run: npm run package:firefox-source
      - name: Submit the add-on and source to AMO
        if: steps.secrets.outputs.ready == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          DM_FIREFOX_SOURCE_ZIP: ${{ github.workspace }}/design-mode-firefox-source.zip
        run: |
          unzip -q store/design-mode-addon.zip -d amo-source
          cat > amo-metadata.json <<'EOF'
          {
            "version": {
              "approval_notes": "Human-readable source is attached. From the archive root: npm ci && npm run package:extension:firefox. Steps are in SOURCE-BUILD-README.md."
            }
          }
          EOF
          # Listed review of <all_urls> is manual and can take days. approval-timeout 0
          # returns once AMO has accepted the upload and validation, without waiting
          # for a reviewer to sign the xpi.
          npx web-ext sign \
            --source-dir amo-source \
            --artifacts-dir amo-artifacts \
            --channel listed \
            --upload-source-code "$DM_FIREFOX_SOURCE_ZIP" \
            --amo-metadata amo-metadata.json \
            --approval-timeout 0 \
            --timeout 900000 \
            --no-input \
            --no-config-discovery

  publish-npm:
    name: npm
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          package-manager-cache: false
      - name: Install an npm CLI that supports trusted publishing
        run: |
          npm install -g npm@11.21.2
          node --input-type=module -e '
            const [major, minor] = process.versions.node.split(".").map(Number);
            if (major < 22 || (major === 22 && minor < 14)) {
              console.error(`Node ${process.versions.node} is below the 22.14.0 trusted-publishing minimum`);
              process.exit(1);
            }
          '
          npm --version
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
            const [major, minor, patch] = version.split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) {
              console.error(`npm ${version} is below the 11.5.1 trusted-publishing minimum`);
              process.exit(1);
            }
            console.log(`npm ${version} supports trusted publishing`);
          '
      - name: Install dependencies
        run: npm ci
      - name: Publish @designmode-app/cli
        run: |
          echo "Publishing @designmode-app/cli with npm trusted publishing (GitHub Actions OIDC)."
          echo "No NPM_TOKEN is used. Provenance is requested explicitly and is also generated automatically for a public package from a public repository."
          npm publish --workspace @designmode-app/cli --access public --provenance
