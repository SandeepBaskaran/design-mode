<!doctype html><title>Radius and Motion fixture</title><style>body{padding:40px;font-family:sans-serif}#radius,#motion{width:180px;height:100px;background:coral;margin-bottom:30px}#radius{border-radius:3px 7px 11px 17px}#motion{transform:translateX(3px);transition:opacity .2s;animation:fade 10s infinite;offset-path:path("M 0 0 L 10 0");view-transition-name:motion;animation-timeline:scroll()}@keyframes fade{from{opacity:.9}to{opacity:1}}</style><div id="radius">Radius</div><div id="motion">Motion</div>
